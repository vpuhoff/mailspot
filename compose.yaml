services:
  mailspot:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8080:8080"
    environment:
      RETENTION: ${RETENTION:-72h}
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-1m}
      MAX_MESSAGES: ${MAX_MESSAGES:-3000000}
      MAX_MESSAGE_BYTES: ${MAX_MESSAGE_BYTES:-10485760}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-262144}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-32}
    volumes:
      - mailspot-data:/data
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  mailspot-data:
